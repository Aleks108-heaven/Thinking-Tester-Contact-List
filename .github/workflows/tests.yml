name: Automated Test Suite

# Trigger this workflow on push to main or on pull requests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow manual trigger via GitHub UI
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # Can add multiple Node versions if desired
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Run all tests
        run: npm test
        env:
          # Optional: add environment-specific config here
          PLAYWRIGHT_TEST_BASE_URL: https://thinking-tester-contact-list.herokuapp.com
      
      - name: Generate HTML report
        if: always()
        run: npx playwright show-report
      
      - name: Upload test results (HTML report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30
      
      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-node-${{ matrix.node-version }}
          path: junit-results.xml
          retention-days: 30
      
      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const junitPath = 'junit-results.xml';
            
            if (fs.existsSync(junitPath)) {
              const junit = fs.readFileSync(junitPath, 'utf8');
              
              // Parse basic stats from JUnit XML (optional enhancement)
              const testMatch = junit.match(/tests="(\d+)"/);
              const failuresMatch = junit.match(/failures="(\d+)"/);
              const errorsMatch = junit.match(/errors="(\d+)"/);
              
              const tests = testMatch ? testMatch[1] : 'unknown';
              const failures = failuresMatch ? failuresMatch[1] : '0';
              const errors = errorsMatch ? errorsMatch[1] : '0';
              
              const comment = `
              ## Test Results (Node ${{ matrix.node-version }})
              - Total Tests: ${tests}
              - Failures: ${failures}
              - Errors: ${errors}
              
              📊 Full report available in Artifacts.
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # Separate job to check if tests passed overall
  test-summary:
    name: Test Summary
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" = "failure" ]; then
            echo "❌ Tests failed. Please review the test report."
            exit 1
          else
            echo "✅ All tests passed!"
          fi
